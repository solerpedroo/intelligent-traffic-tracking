name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      detector_smoke:
        description: "Explicitly download official weights/example and run real CPU smoke"
        type: boolean
        default: false

      counting_smoke:
        description: "Explicitly download traffic example and compare annotated crossings on CPU"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detector:
    if: github.event_name == 'workflow_dispatch' && (inputs.detector_smoke || inputs.counting_smoke)
    name: Explicit vision CPU smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked --extra api --extra video --extra detector --python 3.12
      - run: .venv/bin/traffic-video prepare-model yolo11n-coco --directory checkpoints
      - run: .venv/bin/python scripts/smoke_detector.py --checkpoint checkpoints/yolo11n.pt --output-dir artifacts/cpu-smoke --download-example
      - run: .venv/bin/pytest -m "detector or tracker"
      - run: .venv/bin/python scripts/smoke_detector.py --checkpoint checkpoints/yolo11n.pt --image data/detector-smoke-bus.jpg --tracker bytetrack-default --output-dir artifacts/tracking-smoke
      - name: Explicit real traffic counting smoke
        if: inputs.counting_smoke
        run: .venv/bin/python scripts/smoke_counting.py --download-example --checkpoint checkpoints/yolo11n.pt --output-dir artifacts/counting-smoke
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --locked --extra api --extra video --python ${{ matrix.python }}
      - run: .venv/bin/ruff check vision backend scripts
      - run: .venv/bin/ruff format --check vision backend scripts
      - run: .venv/bin/pytest

  package:
    name: Installed core without API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
      - run: uv build
      - run: uv venv --python 3.12 /tmp/traffic-core
      - run: uv pip install --python /tmp/traffic-core/bin/python dist/*.whl
      - name: Verify installed package and packaged catalog
        working-directory: /tmp
        run: |
          /tmp/traffic-core/bin/python -I - <<'PY'
          import contextlib
          import importlib.util
          import io
          import json
          from vision.contracts import Detection, FramePacket, ProcessingConfig, RunManifest
          from vision.configs import load_catalog
          from vision.contracts import CountingConfig, LineConfig
          from vision.counting.lines import LineCounter
          lines = CountingConfig(lines=(LineConfig(line_id="gate", start=(0., 0.5), end=(1., 0.5)),))
          assert LineCounter(lines, 100, 100, "run", "video").summary()["total_events"] == 0
          from vision.pipeline.cli import main
          assert load_catalog().get_model("yolo11n-coco").filename == "yolo11n.pt"
          for name in ("fastapi", "uvicorn", "torch", "cv2", "av"):
              assert importlib.util.find_spec(name) is None, name
          error = io.StringIO()
          with contextlib.redirect_stderr(error):
              assert main(["capabilities"]) == 2
          assert json.loads(error.getvalue())["error_code"] == "missing_video_extra"
          PY

  frontend:
    name: Web quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
