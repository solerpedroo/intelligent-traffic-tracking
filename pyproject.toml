[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "intelligent-traffic-tracking"
version = "0.1.0"
description = "Reproducible traffic video tracking and counting core"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.2,<3",
    "pydantic>=2.12,<3",
]

[project.scripts]
traffic-video = "vision.pipeline.cli:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.34,<1",
]
video = [
    "av>=16,<19",
    "opencv-python-headless>=4.12,<5",
]
detector = [
    "ultralytics-opencv-headless==8.4.177",
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["vision", "backend"]

[tool.hatch.build]
exclude = ["**/tests/**", "**/__pycache__/**"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["vision/tests", "backend/tests"]
addopts = "-ra --strict-markers -m 'not detector'"
markers = ["detector: real YOLO integration requiring explicit local checkpoint and example image"]
filterwarnings = ["error"]
